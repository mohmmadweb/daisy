name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Every night at 00:30 UTC (04:00 Tehran) so past events move to "Past"
    # and upcoming ones appear on the home page without anyone pushing.
    - cron: '30 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # If a content file has a mistake, this step fails and names the file
      # and field; the live site keeps showing the previous version.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
