# Pages CMS configuration — https://pagescms.org
# Sign in at https://app.pagescms.org with GitHub, open mohmmadweb/daisy, and
# every section below appears as a form. Saving a form commits to GitHub and
# the site rebuilds in about two minutes.

media:
  input: public/images
  output: /images
  rename: safe
  categories: [image, document]

components:
  tags:
    label: Topics
    type: string
    list: true
  people:
    label: People involved
    type: reference
    options: { collection: people, multiple: true, value: "{name}", label: "{fields.name}", search: "name" }
  areas:
    label: Research areas
    type: reference
    options: { collection: research, multiple: true, value: "{name}", label: "{fields.title}" }
  sample:
    label: Sample entry (hidden when samples are switched off)
    type: boolean
    default: false
  draft:
    label: Draft (not shown on the site)
    type: boolean
    default: false

content:
  # ── People ────────────────────────────────────────────────
  - name: people
    label: People
    type: collection
    path: content/people
    filename: "{primary}.md"
    exclude: [_template.md]
    view:
      primary: name
      fields: [name, role, start, end]
      default: { sort: name, order: asc }
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: name_fa, label: Name in Persian (optional), type: string }
      - name: role
        label: Role
        type: select
        required: true
        default: phd
        options:
          values:
            - { name: faculty, label: Faculty }
            - { name: postdoc, label: Postdoc }
            - { name: phd, label: PhD student }
            - { name: msc, label: MSc student }
            - { name: bsc, label: Undergraduate }
            - { name: staff, label: Staff }
            - { name: visitor, label: Visitor }
            - { name: affiliate, label: Affiliated researcher }
      - { name: title, label: Title shown under the name, type: string, description: "e.g. PhD Student in Computer Engineering" }
      - { name: photo, label: Photo, type: image, description: "Square photo, at least 400×400 pixels" }
      - { name: email, label: Email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: office, label: Office, type: string }
      - { name: start, label: Year joined, type: number }
      - { name: end, label: Year left (moves them to Alumni), type: number, description: "Leave empty while they are in the lab" }
      - { name: next, label: Where they went after the lab, type: string, description: "e.g. PhD student, EPFL" }
      - name: next_type
        label: Type of next position
        type: select
        options: { values: [academia, industry, startup, other] }
      - name: thesis
        label: Thesis
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: url, label: Link to full text, type: string }
          - { name: year, label: Year, type: number }
      - { name: co_advisor, label: Co-advisor, type: string }
      - { name: interests, label: Research interests, type: string, list: true }
      - { name: areas, component: areas }
      - { name: aliases, label: Other spellings of the name in papers, type: string, list: true }
      - name: links
        label: Profiles
        type: object
        fields:
          - { name: website, label: Personal website, type: string }
          - { name: scholar, label: Google Scholar, type: string }
          - { name: github, label: GitHub, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: orcid, label: ORCID, type: string }
          - { name: dblp, label: DBLP, type: string }
          - { name: researchgate, label: ResearchGate, type: string }
          - { name: twitter, label: X / Twitter, type: string }
          - { name: cv, label: CV (link), type: string }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: degree, label: Degree, type: string }
          - { name: field, label: Field, type: string }
          - { name: institution, label: Institution, type: string }
          - { name: year, label: Year, type: number }
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: title, label: Position, type: string }
          - { name: org, label: Organisation, type: string }
          - { name: period, label: Period, type: string }
          - { name: description, label: Description, type: text }
      - { name: order, label: Order within group (lower first), type: number, default: 99 }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Biography, type: rich-text }

  # ── Publications ──────────────────────────────────────────
  - name: publications
    label: Publications
    type: collection
    path: content/publications
    filename: "{fields.year}-{primary}.md"
    exclude: [_template.md]
    view:
      primary: title
      fields: [title, year, type, selected]
      default: { sort: year, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: authors, label: Authors (in order), type: string, list: true, required: true, description: "Lab members are linked to their profile automatically" }
      - { name: venue, label: Venue, type: string, required: true, description: "Journal or conference name, or: arXiv preprint" }
      - { name: venue_short, label: Venue abbreviation, type: string, description: "e.g. VLDB, SIGMOD, ACM TKDD" }
      - { name: year, label: Year, type: number, required: true }
      - { name: date, label: Publication date, type: date, default: "" }
      - name: type
        label: Type
        type: select
        required: true
        default: conference
        options: { values: [journal, conference, workshop, preprint, chapter, thesis, other] }
      - { name: doi, label: DOI, type: string, description: "Only the DOI, e.g. 10.1038/s41598-024-82286-x" }
      - { name: arxiv, label: arXiv id, type: string, description: "e.g. 2504.10753" }
      - { name: url, label: Publisher page, type: string }
      - { name: pdf, label: PDF (upload or link), type: file }
      - { name: code, label: Code repository, type: string }
      - { name: data, label: Data, type: string }
      - { name: slides, label: Slides (upload or link), type: file }
      - { name: video, label: Video, type: string }
      - { name: poster, label: Poster, type: file }
      - { name: website, label: Project website, type: string }
      - { name: award, label: Award, type: string, description: "e.g. Best Paper Award" }
      - { name: selected, label: Show on the home page, type: boolean, default: false }
      - { name: areas, component: areas }
      - { name: tags, component: tags }
      - { name: abstract, label: Abstract, type: text }
      - { name: bibtex, label: Custom BibTeX (optional, generated automatically otherwise), type: code }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Plain-language summary, type: rich-text }

  # ── News ──────────────────────────────────────────────────
  - name: news
    label: News
    type: collection
    path: content/news
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, category]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Headline, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - name: category
        label: Category
        type: select
        required: true
        default: announcement
        options: { values: [announcement, publication, award, talk, people, event, media, thesis] }
      - { name: summary, label: One-sentence summary, type: text, required: true }
      - { name: people, component: people }
      - { name: publication, label: Related publication, type: reference, options: { collection: publications, value: "{name}", label: "{fields.title}", search: "title" } }
      - { name: link, label: External link, type: string }
      - { name: image, label: Image, type: image }
      - { name: tags, component: tags }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Full story, type: rich-text }

  # ── Events ────────────────────────────────────────────────
  - name: events
    label: Events and seminars
    type: collection
    path: content/events
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date, type]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: type
        label: Type
        type: select
        required: true
        default: seminar
        options:
          values:
            - { name: seminar, label: Seminar }
            - { name: reading-group, label: Reading group }
            - { name: talk, label: Talk }
            - { name: workshop, label: Workshop }
            - { name: defense, label: Thesis defence }
            - { name: social, label: Social }
      - { name: series, label: Series, type: string, description: "e.g. DAISY Seminar" }
      - { name: date, label: Starts (Tehran time), type: date, required: true, options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssxxx" } }
      - { name: end, label: Ends, type: date, default: "", options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ssxxx" } }
      - { name: speaker, label: Speaker, type: string }
      - { name: affiliation, label: Speaker affiliation, type: string }
      - { name: speaker_url, label: Speaker website, type: string }
      - { name: location, label: Location, type: string }
      - { name: online, label: Online meeting link, type: string }
      - { name: slides, label: Slides (after the event), type: file }
      - { name: video, label: Recording (after the event), type: string }
      - { name: people, component: people }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Abstract and speaker bio, type: rich-text }

  # ── Research ──────────────────────────────────────────────
  - name: research
    label: Research directions
    type: collection
    path: content/research
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, order, status]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: short, label: Short label for the home-page flower, type: string }
      - { name: summary, label: One-sentence summary, type: text, required: true }
      - { name: order, label: Order, type: number, default: 99 }
      - name: status
        label: Status
        type: select
        default: active
        options:
          values:
            - { name: active, label: Established }
            - { name: new, label: New direction (dashed petal) }
            - { name: past, label: Past }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Description, type: rich-text }

  # ── Software, datasets, benchmarks ────────────────────────
  - name: projects
    label: Software and data
    type: collection
    path: content/projects
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, kind, status]
    fields:
      - { name: title, label: Name, type: string, required: true }
      - name: kind
        label: Kind
        type: select
        required: true
        default: software
        options: { values: [software, dataset, benchmark, project] }
      - { name: summary, label: One-sentence summary, type: text, required: true }
      - name: status
        label: Status
        type: select
        default: active
        options: { values: [active, archived] }
      - { name: repo, label: Source code repository, type: string }
      - { name: download, label: Download link, type: string }
      - { name: docs, label: Documentation, type: string }
      - { name: website, label: Website, type: string }
      - { name: license, label: License, type: string }
      - { name: publication, label: Paper that introduced it, type: reference, options: { collection: publications, value: "{name}", label: "{fields.title}", search: "title" } }
      - { name: areas, component: areas }
      - { name: people, label: Maintainers, type: reference, options: { collection: people, multiple: true, value: "{name}", label: "{fields.name}", search: "name" } }
      - { name: tags, component: tags }
      - { name: cite, label: Custom citation (BibTeX), type: code }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Description, type: rich-text }

  # ── Teaching ──────────────────────────────────────────────
  - name: teaching
    label: Courses
    type: collection
    path: content/teaching
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, code, level]
    fields:
      - { name: code, label: Course code, type: string }
      - { name: title, label: Title, type: string, required: true }
      - name: level
        label: Level
        type: select
        required: true
        default: graduate
        options: { values: [graduate, undergraduate] }
      - { name: terms, label: Terms offered, type: string, list: true, description: "e.g. Fall 2026" }
      - { name: instructor, label: Instructor, type: reference, options: { collection: people, value: "{name}", label: "{fields.name}" } }
      - { name: website, label: Course website, type: string }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Description, type: rich-text }

  # ── Positions ─────────────────────────────────────────────
  - name: positions
    label: Open positions
    type: collection
    path: content/positions
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, status]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: level, label: Level, type: string, required: true, description: "e.g. PhD, MSc, Internship" }
      - name: status
        label: Status
        type: select
        required: true
        default: open
        options: { values: [open, closed] }
      - { name: summary, label: One-sentence summary, type: text, required: true }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Details, type: rich-text }

  # ── Blog ──────────────────────────────────────────────────
  - name: blog
    label: Blog
    type: collection
    path: content/blog
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      primary: title
      fields: [title, date]
      default: { sort: date, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: authors, label: Authors, type: reference, options: { collection: people, multiple: true, value: "{name}", label: "{fields.name}", search: "name" } }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: cover, label: Cover image, type: image }
      - { name: tags, component: tags }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Post, type: rich-text }

  # ── Handbook ──────────────────────────────────────────────
  - name: handbook
    label: Lab handbook
    type: collection
    path: content/handbook
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, order]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Summary, type: string }
      - { name: order, label: Order, type: number, default: 99 }
      - { name: sample, component: sample }
      - { name: draft, component: draft }
      - { name: body, label: Content, type: rich-text }

  # ── Fixed pages ───────────────────────────────────────────
  - name: pages
    label: Page text (About, Join, Contact)
    type: collection
    path: content/pages
    view:
      primary: title
      fields: [title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: summary, label: Intro sentence, type: text }
      - { name: body, label: Text, type: rich-text }

  # ── Gallery ───────────────────────────────────────────────
  - name: gallery
    label: Photo gallery
    type: file
    path: content/gallery.yml
    format: yaml
    list: true
    fields:
      - { name: src, label: Photo, type: image, required: true }
      - { name: caption, label: Caption, type: string, required: true }
      - { name: date, label: Date, type: date, default: "" }

  # ── Lab settings ──────────────────────────────────────────
  - name: site
    label: Lab settings
    type: file
    path: content/site.yml
    format: yaml
    fields:
      - { name: name, label: Short name, type: string, required: true }
      - { name: full_name, label: Full name, type: string, required: true }
      - { name: tagline, label: Home-page headline, type: string }
      - { name: intro, label: Home-page introduction, type: text }
      - { name: description, label: Description for search engines, type: text }
      - { name: founded, label: Year founded, type: number }
      - { name: university, label: University, type: string }
      - { name: university_url, label: University website, type: string }
      - { name: department, label: Department, type: string }
      - { name: department_url, label: Department website, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: phone, label: Phone, type: string }
      - { name: address, label: Address lines, type: string, list: true }
      - name: map
        label: Map pin
        type: object
        fields:
          - { name: lat, label: Latitude, type: number }
          - { name: lon, label: Longitude, type: number }
      - name: admissions
        label: Admissions banner
        type: object
        fields:
          - { name: accepting, label: Accepting students, type: boolean }
          - { name: cycle, label: For which intake, type: string, description: "e.g. the 2027 intake" }
          - { name: note, label: Extra note, type: string }
      - name: social
        label: Social media links
        type: object
        fields:
          - { name: github, label: GitHub, type: string }
          - { name: twitter, label: X / Twitter, type: string }
          - { name: linkedin, label: LinkedIn, type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: telegram, label: Telegram, type: string }
          - { name: instagram, label: Instagram, type: string }
      - name: sponsors
        label: Sponsors and funders
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: url, label: Website, type: string }
          - { name: logo, label: Logo, type: image }
      - name: affiliations
        label: Affiliations
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: url, label: Website, type: string }
      - { name: show_samples, label: Show sample entries, type: boolean, description: "Switch off once real content is in place" }
      - { name: repo, label: GitHub repository URL, type: string }

# Buttons in the editor that run GitHub Actions.
actions:
  - name: add-paper
    label: Add a paper from its DOI or arXiv id
    workflow: add-paper.yml
    ref: current
    fields:
      - { name: id, label: DOI or arXiv id, type: string, required: true }
