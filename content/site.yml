name: DAISY Lab
full_name: Data-Centric AI Systems Lab
tagline: Data-centric AI systems, built to survive real data.
intro: >-
  We build AI systems that treat data as a first-class citizen — learning to
  optimize databases and infrastructure, making data accessible through natural
  language, and understanding the networks that data lives in.
description: >-
  DAISY Lab studies data-centric AI systems at Sharif University of Technology:
  machine learning for systems, systems for machine learning, database
  optimization, Text-to-SQL, AI agents, and complex networks.
founded: 2024

university: Sharif University of Technology
university_url: https://www.sharif.edu
department: Department of Computer Engineering
department_url: https://ce.sharif.edu

